version: '3.8'

services:
  backend:
    build: .
    container_name: railtrack-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - railtrack-network

  mongodb:
    image: mongo:7.0
    container_name: railtrack-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=railtrack_ai
    networks:
      - railtrack-network

  redis:
    image: redis:7-alpine
    container_name: railtrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - railtrack-network

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  railtrack-network:
    driver: bridge
